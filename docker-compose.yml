version: "3.9"

services:
  licensing-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Change these before deploying!
      - API_KEY=your-app-api-key-here
      - ADMIN_KEY=your-admin-key-here
      - DB_PATH=/data/licenses.db
    volumes:
      # Persists the SQLite database file outside the container
      - ./data:/data
    restart: unless-stopped
